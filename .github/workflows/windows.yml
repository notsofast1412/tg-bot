name: Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Find fixture browser on Windows
        shell: powershell
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Google\Chrome\Application\chrome.exe")
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No fixture browser installed on runner' }
          "PAINTWATCH_TEST_BROWSER=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Python tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\paintwatch-test-logs" | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\paintwatch-test-logs\python.log"
          exit $LASTEXITCODE
      - name: JavaScript tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\paintwatch-test-logs" | Out-Null
          node --version
          node --test --test-reporter=spec extension/tests/extractor.test.cjs extension/tests/background.test.cjs extension/tests/content.test.cjs extension/tests/popup.test.cjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\paintwatch-test-logs\javascript.log"
          exit $LASTEXITCODE
      - run: ruff check .
      - run: ruff format --check .
      - name: Check application window
        run: python run_app.py --smoke-test --data-dir "$env:RUNNER_TEMP\paintwatch-ui-smoke"
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PaintWatch-test-logs
          path: ${{ runner.temp }}/paintwatch-test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: PaintWatch-extension
          path: extension/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - shell: powershell
        run: |
          $env:PAINTWATCH_BUILD_PYTHON = (Get-Command python).Source
          ./build.ps1
      - name: Check packaged application
        shell: powershell
        run: |
          $process = Start-Process -FilePath '.\dist\PaintWatch\PaintWatch.exe' -ArgumentList @('--smoke-test', '--data-dir', "$env:RUNNER_TEMP\paintwatch-exe-smoke") -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged application timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged application smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PaintWatch-Windows-x64
          path: dist/PaintWatch/
          if-no-files-found: error
          retention-days: 14
