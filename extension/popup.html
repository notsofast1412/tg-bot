<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>PaintWatch</title>
<style>body{font:14px system-ui;width:330px;padding:14px;color:#172033}input{box-sizing:border-box;width:100%;padding:9px;margin:8px 0}button{padding:9px;margin:4px 0;cursor:pointer}#status{white-space:pre-wrap;line-height:1.5}small{color:#526074}</style>
<h2>PaintWatch</h2>
<label for="key">Код подключения из настроек приложения</label>
<input id="key" type="password" autocomplete="off">
<button id="connect">Подключить</button>
<button id="check">Проверить сейчас</button>
<button id="open">Открыть проверяемую карточку</button>
<p id="status">Подключите расширение к PaintWatch</p>
<small>Оставьте обычный браузер и PaintWatch открытыми. CAPTCHA проходится вручную. Интервал и пороги задаются в приложении.</small>
<script src="popup.js"></script></html>
